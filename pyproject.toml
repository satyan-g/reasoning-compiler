[project]
name = "reasoning-compiler"
version = "0.1.0"
description = "Verified reasoning via compilation"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "z3-solver>=4.12",
    "tiktoken>=0.5",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ipython", "matplotlib", "pandas", "scipy"]
nlp = ["spacy>=3.5", "amrlib>=0.8", "transformers>=4.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
